#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "pretix"
name = "Pretix"
description.en = "Ticket shop for conferences, festivals, concerts..."
description.fr = "Billetterie pour conférences, festivals, concerts..."

version = "2026.9.3~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
website = "https://pretix.eu/"
demo = "https://pretix.eu/about/en/setup"
admindoc = "https://docs.pretix.eu/en/latest/admin/installation/manual_smallscale.html"
code = "https://github.com/pretix/pretix"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    url = "https://github.com/pretix/pretix/archive/refs/tags/v2026.9.3.tar.gz"
    sha256 = "202ab2efae3aeca2624e04a965a90a7873629155c52faa5a3a7c3ed9552763df"
    autoupdate.strategy = "latest_github_tag"
    prefetch = false

    [resources.system_user]
    allow_email = true

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]
    subdirs = ["media"]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "redis-server, postgresql, postgresql-contrib, build-essential, python3-yaml, python3-dev, python3-venv, python3, python3-pip, libxml2-dev, libxslt1-dev, libffi-dev, zlib1g-dev, libssl-dev, gettext, libpq-dev, libjpeg-dev, libopenjp2-7-dev"

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "24"
